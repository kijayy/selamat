<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selamat, Lime!</title>
<style>
:root{--bg:#fff6ee;--card:#fff;--ink:#3a3340;--soft:#7a6f80;--ac:#ff8fab;--ac2:#ffd6a5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241f2b;--card:#322b3b;--ink:#f6eef8;--soft:#c5b8cc;--ac:#ff9db6;--ac2:#6b5560}}
:root[data-theme="dark"]{--bg:#241f2b;--card:#322b3b;--ink:#f6eef8;--soft:#c5b8cc;--ac:#ff9db6;--ac2:#6b5560}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,sans-serif;text-align:center;overflow-x:hidden}
.hero{padding:40px 20px 20px;background:radial-gradient(circle at 50% 0,var(--ac2),transparent 70%)}
h1{font-size:clamp(2rem,8vw,3.2rem);margin:10px 0 6px}
.sub{color:var(--soft);max-width:460px;margin:0 auto 18px;line-height:1.6}
.cat{width:min(280px,76vw);animation:bob 3s ease-in-out infinite;overflow:visible}
@keyframes bob{50%{transform:translateY(-8px)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.paw{transform-box:fill-box;transform-origin:50% 100%}
.party .paw{animation:wave .5s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-15deg)}to{transform:rotate(25deg)}}
.tl{transform-box:fill-box;transform-origin:0 100%;animation:tail 2.4s ease-in-out infinite}
@keyframes tail{50%{transform:rotate(8deg)}}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 26px;background:var(--ac);color:#3a1020;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
button:active{transform:translateY(2px)}
.now{min-height:1.5em;margin-top:12px;color:var(--soft);font-size:.95rem}
.cards{display:grid;gap:14px;max-width:520px;margin:30px auto;padding:0 18px}
.card{background:var(--card);border-radius:20px;padding:18px 20px;line-height:1.65;box-shadow:0 6px 18px rgba(0,0,0,.08);text-align:left;border-left:6px solid var(--ac)}
.flowers{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:10px 0}
.flowers svg{transform-origin:50% 100%;animation:sway 3.5s ease-in-out infinite}
.flowers svg:nth-child(even){animation-delay:-1.7s}
@keyframes sway{50%{transform:rotate(5deg)}}
footer{color:var(--soft);padding:10px 20px 40px}
.c{position:fixed;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="lily" viewBox="0 0 60 80"><rect x="28" y="40" width="4" height="40" fill="#6bbf8a"/><g fill="#ffc2d9" stroke="#e58aa8"><ellipse cx="30" cy="16" rx="6" ry="14"/><ellipse cx="30" cy="16" rx="6" ry="14" transform="rotate(60 30 30)"/><ellipse cx="30" cy="16" rx="6" ry="14" transform="rotate(120 30 30)"/><ellipse cx="30" cy="16" rx="6" ry="14" transform="rotate(180 30 30)"/><ellipse cx="30" cy="16" rx="6" ry="14" transform="rotate(240 30 30)"/><ellipse cx="30" cy="16" rx="6" ry="14" transform="rotate(300 30 30)"/></g><circle cx="30" cy="30" r="4" fill="#f5b942"/></symbol>
<symbol id="tulip" viewBox="0 0 40 80"><rect x="18" y="38" width="4" height="42" fill="#6bbf8a"/><path d="M8 10Q8 40 20 40Q32 40 32 10L26 20L20 6L14 20Z" fill="#ff7a9c"/></symbol></defs></svg>
<section class="hero">
<svg class="cat" id="cat" viewBox="0 0 240 232" aria-label="Kucing gemoy yang ceria">
<defs><clipPath id="hc"><ellipse cx="120" cy="94" rx="66" ry="56"/></clipPath></defs>
<path class="tl" d="M186 178C238 172 236 112 208 108" stroke="#2b2b33" stroke-width="17" fill="none" stroke-linecap="round"/>
<ellipse cx="120" cy="170" rx="72" ry="55" fill="#fff" stroke="#2b2b33" stroke-width="3"/>
<ellipse cx="152" cy="178" rx="22" ry="26" fill="#2b2b33"/>
<ellipse cx="90" cy="217" rx="20" ry="11" fill="#fff" stroke="#2b2b33" stroke-width="3"/><ellipse cx="150" cy="217" rx="20" ry="11" fill="#fff" stroke="#2b2b33" stroke-width="3"/>
<ellipse class="paw" cx="56" cy="160" rx="12" ry="20" fill="#fff" stroke="#2b2b33" stroke-width="3" transform="rotate(12 56 160)"/>
<path d="M60 76Q54 20 74 22Q96 30 108 54Z" fill="#fff" stroke="#2b2b33" stroke-width="3" stroke-linejoin="round"/><path d="M70 56Q68 36 76 34Q86 40 92 52Z" fill="#ffc2d1"/>
<path d="M180 76Q186 20 166 22Q144 30 132 54Z" fill="#2b2b33" stroke="#2b2b33" stroke-width="3" stroke-linejoin="round"/>
<ellipse cx="120" cy="94" rx="66" ry="56" fill="#fff" stroke="#2b2b33" stroke-width="3"/>
<ellipse cx="164" cy="64" rx="30" ry="24" fill="#2b2b33" clip-path="url(#hc)"/>
<g class="eye"><circle cx="92" cy="100" r="10" fill="#2b2b33"/><circle cx="96" cy="96" r="4" fill="#fff"/><circle cx="90" cy="104" r="1.8" fill="#fff"/></g>
<g class="eye"><circle cx="148" cy="100" r="10" fill="#2b2b33"/><circle cx="152" cy="96" r="4" fill="#fff"/><circle cx="146" cy="104" r="1.8" fill="#fff"/></g>
<ellipse cx="72" cy="118" rx="12" ry="7" fill="#ffb3c6" opacity=".7"/><ellipse cx="168" cy="118" rx="12" ry="7" fill="#ffb3c6" opacity=".7"/>
<path d="M115 111h10l-5 6z" fill="#ff8fab"/><path d="M120 117q-5 9-12 3M120 117q5 9 12 3" stroke="#2b2b33" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<path d="M54 108l-24-5M54 117l-24 7M186 108l24-5M186 117l24 7" stroke="#2b2b33" stroke-width="2" stroke-linecap="round"/>
</svg>
<h1>Selamat, Lime!</h1>
<p class="sub">ciee yang terpilih inget yaa nanti aku bakal bikin ketawa okeeyyy</p>
<button id="b">Rayakan 🎉</button>
<div class="now" id="n"></div>
</section>
<div class="flowers"><svg width="44" height="70"><use href="#tulip"/></svg><svg width="54" height="72"><use href="#lily"/></svg><svg width="44" height="70"><use href="#tulip"/></svg><svg width="54" height="72"><use href="#lily"/></svg><svg width="44" height="70"><use href="#tulip"/></svg></div>
<script>
var ctx=null,timers=[],playing=false,btn=document.getElementById("b"),cat=document.getElementById("cat"),nn=document.getElementById("n");
function confetti(){var cols=["#ff8fab","#ffd166","#8fd3b6","#9ad0ff","#c3a6ff"];for(var i=0;i<50;i++){var d=document.createElement("div");d.className="c";d.style.left=Math.random()*100+"vw";d.style.background=cols[i%5];d.style.animationDuration=(2+Math.random()*2.5)+"s";d.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(d);setTimeout(function(x){x.remove()},5500,d)}}
var F={C:261.63,D:293.66,E:329.63,F:349.23,G:392};
var S="E1 E1 F1 G1 G1 F1 E1 D1 C1 C1 D1 E1 E1.5 D.5 D2 E1 E1 F1 G1 G1 F1 E1 D1 C1 C1 D1 E1 D1.5 C.5 C2".split(" ");
function note(f,t,d){var o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain();o.type="triangle";o2.type="sine";o.frequency.value=f;o2.frequency.value=f*2;o.connect(g);o2.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.25);o.start(t);o2.start(t);o.stop(t+d+.3);o2.stop(t+d+.3)}
function stop(){playing=false;btn.textContent="Rayakan 🎉";cat.classList.remove("party");nn.textContent="";timers.forEach(clearTimeout);timers=[];if(ctx){try{ctx.close()}catch(e){}ctx=null}}
function start(){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){ctx=null}
playing=true;btn.textContent="Berhenti ⏸";cat.classList.add("party");nn.textContent="♪ Ode to Joy (Beethoven)";confetti();
var beat=.4,t=ctx?ctx.currentTime+.1:0,total=0;
S.forEach(function(s){var d=parseFloat(s.slice(1))*beat;if(ctx)note(F[s[0]],t+total,d);total+=d});
timers.push(setTimeout(stop,(total+1)*1000));timers.push(setInterval(confetti,3500))}
btn.onclick=function(){playing?stop():start()};
confetti();
</script></body></html>
